<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Turnos | Oficina</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Modal Login -->
  <div id="loginModal" class="overlay">
    <div class="modal">
      <h2 class="card-title">Iniciar Sesión</h2>
      <form id="loginForm">
        <input type="text" id="usernameInput" class="input-text" placeholder="Tu nombre de usuario" required style="margin-bottom: 16px;">
        <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- Contenido Principal -->
  <div id="app" style="display: none;">
    <header>
      <div>
        <h1>Gestión de Turnos</h1>
        <span id="userInfo" style="font-size: 0.85rem; color: var(--text-muted);">Usuario: -</span>
      </div>
      <div id="statusBadge" class="status-badge connected">
        <span class="status-dot"></span>
        <span id="statusText">Sincronizado</span>
      </div>
    </header>

    <div class="card">
      <h2 class="card-title">Registrar Nueva Pareja</h2>
      <form id="pairForm">
        <div style="display: flex; gap: 12px; margin-bottom: 16px;">
          <input type="text" id="nombre1" class="input-text" placeholder="Nombre Integrante 1" required>
          <input type="text" id="nombre2" class="input-text" placeholder="Nombre Integrante 2" required>
        </div>
        <button type="submit" class="btn">➕ Guardar Pareja</button>
      </form>
    </div>

    <div class="card">
      <h2 class="card-title">Parejas Registradas</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Pareja</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="pairsTableBody">
            <!-- Renderizado dinámico -->
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Notas y Observaciones Compartidas</h2>
      <textarea id="notesArea" rows="4" placeholder="Escribe notas compartidas en tiempo real..." style="margin-bottom: 12px;"></textarea>
      <button id="saveNotesBtn" class="btn btn-secondary">💾 Guardar Nota</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
