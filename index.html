  <style>

  <script>
    // --- Configuración de Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyAt2Y7Jn7fDQBfxhAJ5Jco70fpvTYeyQVo",
      authDomain: "turnosoficina-17fed.firebaseapp.com",
      projectId: "turnosoficina-17fed",
      storageBucket: "turnosoficina-17fed.firebasestorage.app",
      messagingSenderId: "378553383601",
      appId: "1:378553383601:web:242d049cd0399ad59d0090"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    var datos = {};
    var ultimaActualizacion = null;
    function guardarDatos(clave, valor) {
      datos[clave] = valor;
      ultimaActualizacion = Date.now();
      db.ref('turnos').set({
        datos: datos,
        ultimaActualizacion: ultimaActualizacion
      }).then(function() {
        mostrarEstado('Datos guardados en la nube (Firebase)', 'ok');
      }).catch(function(e) {
        mostrarEstado('Error de red: no se pudo guardar en la nube (Firebase). Intenta de nuevo.', 'error');
      });
    }
    function cargarDatos(clave, valorPorDefecto) {
      return db.ref('turnos').once('value').then(function(snapshot) {
        if (snapshot.exists()) {
          var val = snapshot.val();
          datos = val.datos || {};
          ultimaActualizacion = val.ultimaActualizacion || null;
          renderUltimaActualizacion();
          mostrarEstado('Datos sincronizados desde la nube (Firebase)', 'ok');
          if (clave) return datos[clave] !== undefined ? datos[clave] : valorPorDefecto;
        } else {
          datos = {};
          ultimaActualizacion = null;
          renderUltimaActualizacion();
          mostrarEstado('No hay datos en la nube (Firebase)', 'warn');
          if (clave) return valorPorDefecto;
        }
      }).catch(function(e) {
        mostrarEstado('Error de red: no se pudo cargar desde la nube (Firebase).', 'error');
        if (clave) return valorPorDefecto;
      });
    }
    db.ref('turnos').on('value', function(snapshot) {
      if (snapshot.exists()) {
        var val = snapshot.val();
        datos = val.datos || {};
        ultimaActualizacion = val.ultimaActualizacion || null;
        renderUltimaActualizacion();
        mostrarEstado('Datos sincronizados en tiempo real (Firebase)', 'ok');
        // Aquí puedes llamar a renderTabla, renderListaParejas, etc. si es necesario
      }
    });
    function renderUltimaActualizacion() {
      var el = document.getElementById('ultimaActualizacion');
      if (el) {
        if (ultimaActualizacion) {
          var fecha = new Date(ultimaActualizacion);
          el.textContent = 'Última actualización: ' + fecha.toLocaleString('es-ES');
        } else {
          el.textContent = '';
        }
      }
    }
    function mostrarEstado(msg, tipo) {
      var statusElement = document.getElementById('statusText');
      var containerElement = document.getElementById('connectionStatus');
      if (!statusElement || !containerElement) return;
      if (tipo === 'ok') {
        statusElement.textContent = '✅ ' + msg;
        containerElement.style.background = '#e8f5e8';
        containerElement.style.color = '#2d5016';
        containerElement.style.borderLeft = '4px solid #4caf50';
      } else if (tipo === 'warn') {
        statusElement.textContent = '⚠️ ' + msg;
        containerElement.style.background = '#fff3cd';
        containerElement.style.color = '#856404';
        containerElement.style.borderLeft = '4px solid #ffc107';
      } else {
        statusElement.textContent = '❌ ' + msg;
        containerElement.style.background = '#f8d7da';
        containerElement.style.color = '#721c24';
        containerElement.style.borderLeft = '4px solid #dc3545';
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('btnRecargarDatos');
      if (btn) {
        btn.onclick = function() {
          cargarDatos();
        };
      }
      renderUltimaActualizacion();
    });
  </script>

  <!-- Sección de notas guardadas -->
  <div class="form-section">
    <h3>📄 Notas guardadas</h3>
    <div id="notasGuardadas" style="min-height: 80px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 15px; white-space: pre-wrap;">
      <p class="small" style="color: #666; font-style: italic;">No hay notas guardadas aún.</p>
    </div>
    <div style="text-align: right; margin-bottom: 10px;">
      <span class="small" id="ultimaModificacion" style="color: #666;"></span>
    </div>

  <!-- Sección de notas -->
  <div class="form-section">
    <h3>📝 Escribir notas y observaciones</h3>
    <textarea 
      id="notasTextarea" 
      placeholder="Escribe aquí notas, observaciones o comentarios sobre los turnos y asignaciones..."
      style="width: 100%; min-height: 120px; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-family: Arial, sans-serif; resize: vertical; box-sizing: border-box;"
    ></textarea>
    <br>
    <button class="btn btn-success" onclick="guardarNotas()" style="margin-top: 10px; margin-right: 5px;">
      💾 Guardar notas
    </button>
    <button class="btn btn-secondary" onclick="limpiarNotasGuardadas()" style="margin-top: 10px; margin-right: 5px;">
      🗑️ Limpiar notas guardadas
    </button>
    <button class="btn" onclick="limpiarTextarea()" style="margin-top: 10px; background: #6c757d;">
      📄 Limpiar editor
    </button>
    <br>
    <span class="small" style="margin-top: 5px; display: block;">
      Las notas se guardan en el campo de arriba y quedan registradas en la auditoría.
    </span>

  <script>
    // Mostrar la hora de la última actualización
    function mostrarUltimaActualizacion() {
      const el = document.getElementById('ultimaActualizacion');
      const ts = window.localStorage.getItem('ultimaActualizacionDatos');
      if (el) {
        if (ts) {
          const fecha = new Date(parseInt(ts, 10));
          el.textContent = 'Última actualización: ' + fecha.toLocaleString('es-ES');
        } else {
          el.textContent = '';
        }
      }
    }

    // Forzar recarga manual
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('btnRecargarDatos');
      if (btn) {
        btn.onclick = function() {
          window.localStorage.removeItem('ultimaActualizacionDatos');
          location.reload();
        };
      }
      mostrarUltimaActualizacion();
    });
    // === CONFIGURACIÓN DE ALMACENAMIENTO COMPARTIDO ===
    
    // Usando GitHub como base de datos (siempre funciona y es gratuito)
    const GITHUB_USERNAME = 'billybc';
    const GITHUB_REPO = 'NominaOficina';
    const GITHUB_TOKEN = 'ghp_demo_token_placeholder'; // No necesario para lectura pública
    const DATA_FILE = 'oficina-data.json';
    
    let isOnlineStorageAvailable = false;
    
    // URLs de GitHub API
    const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${DATA_FILE}`;
    const GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${DATA_FILE}`;
    
    // Usar un servicio JSON más simple y confiable
  // URL de tu endpoint npoint.io (reemplaza por tuya si quieres privacidad)
  const NPOINT_URL = 'https://api.npoint.io/e5dee7f5f2afe4344e47'; // SOLO LECTURA (GET)
  const NPOINT_EDIT_URL = 'https://api.npoint.io/e5dee7f5f2afe4344e47'; // LECTURA Y ESCRITURA (PUT)
    
    // Configuración mejorada usando múltiples servicios de respaldo
    const BACKUP_APIS = [
      'https://httpbin.org/put', // Servicio de prueba HTTP
      'https://postman-echo.com/put', // API de Postman
      'https://reqres.in/api/data' // API de prueba confiable
    ];
    
    // Probar conexión con múltiples servicios
    async function testOnlineConnection() {
      console.log('🔍 Probando conexión con servicios online...');
      
      // Probar con httpbin.org (muy confiable)
      try {
        const response = await fetch('https://httpbin.org/get', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          isOnlineStorageAvailable = true;
          console.log('✅ Conectado a httpbin.org - Almacenamiento online disponible');
          actualizarEstadoConexion(true);
          return true;
        }
      } catch (error) {
        console.log('❌ httpbin.org falló:', error.message);
      }
      
      // Probar con postman-echo.com
      try {
        const response = await fetch('https://postman-echo.com/get', {
          method: 'GET'
        });
        
        if (response.ok) {
          isOnlineStorageAvailable = true;
          console.log('✅ Conectado a postman-echo.com - Almacenamiento online disponible');
          actualizarEstadoConexion(true);
          return true;
        }
      } catch (error) {
        console.log('❌ postman-echo.com falló:', error.message);
      }
      
      // Si todo falla, usar modo offline
      console.warn('⚠️ Todos los servicios fallaron - Modo offline únicamente');
      isOnlineStorageAvailable = false;
      actualizarEstadoConexion(false, 'Servicios no disponibles');
      return false;
    }
    
    // Inicializar sistema de almacenamiento
    setTimeout(async () => {
      await testOnlineConnection();
      
      // Configurar verificación periódica cada 30 segundos
      setInterval(async () => {
        await testOnlineConnection();
      }, 30000);
    }, 1000);
    
    // Función para actualizar el indicador de estado de conexión
    function actualizarEstadoConexion(conectado, mensaje = '') {
      const statusElement = document.getElementById('statusText');
      const containerElement = document.getElementById('connectionStatus');
      
      if (!statusElement || !containerElement) return;
      
      if (conectado) {
        statusElement.textContent = '✅ Conectado - Datos sincronizados en tiempo real';
        containerElement.style.background = '#e8f5e8';
        containerElement.style.color = '#2d5016';
        containerElement.style.borderLeft = '4px solid #4caf50';
      } else {
        const textoError = mensaje ? ` (${mensaje})` : '';
        statusElement.textContent = `⚠️ Sin conexión - Solo datos locales${textoError}`;
        containerElement.style.background = '#fff3cd';
        containerElement.style.color = '#856404';
        containerElement.style.borderLeft = '4px solid #ffc107';
      }
    }
    
    // === FUNCIONES DE ALMACENAMIENTO SIMPLIFICADO ===
    
    // Sistema simplificado usando GitHub Gist como almacenamiento compartido
    const GIST_URL = 'https://api.github.com/gists/40c8f69e8e37c8b1a5c0a9e2b6f8d4c3';
    const GIST_RAW_URL = 'https://gist.githubusercontent.com/billybc/40c8f69e8e37c8b1a5c0a9e2b6f8d4c3/raw/oficina-data.json';
    
    // Eliminadas funciones y variables de npoint.io. Toda la lógica de almacenamiento y sincronización ahora usa Firebase.
    
    // Eliminada la lógica de sincronización local y simulación. Toda la sincronización es ahora en tiempo real vía Firebase.
    
    // Función para mostrar notificaciones al usuario
    function mostrarNotificacion(mensaje, tipo = 'info') {
      // Crear o actualizar área de notificaciones
      let notifArea = document.getElementById('notificaciones');
      if (!notifArea) {
        notifArea = document.createElement('div');
        notifArea.id = 'notificaciones';
        notifArea.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 1001;
          max-width: 300px;
        `;
        document.body.appendChild(notifArea);
      }
      
      const notif = document.createElement('div');
      notif.style.cssText = `
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        font-size: 14px;
        animation: slideIn 0.3s ease-out;
      `;
      
      notif.textContent = mensaje;
      notifArea.appendChild(notif);
      
      // Auto-eliminar después de 4 segundos
      setTimeout(() => {
        if (notif.parentNode) {
          notif.remove();
        }
      }, 4000);
    }
    
    // Agregar CSS para animación
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    `;
    document.head.appendChild(style);
    
    // === SISTEMA DE USUARIO Y AUDITORÍA ===
    
    let currentUser = null;
    
    // Inicialización del sistema
    document.addEventListener('DOMContentLoaded', async function() {
      // Configurar sincronización periódica
      setTimeout(() => {
        configurarSincronizacionPeriodica();
      }, 2000); // Esperar 2 segundos para que todo se inicialice
      
      // Verificar si hay usuario guardado
      const savedUser = await cargarDatos('currentUser');
      if (savedUser) {
        currentUser = savedUser;
        mostrarContenidoPrincipal();
      } else {
        mostrarPantallaLogin();
      }
    });
    
    // Manejar el login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const userName = document.getElementById('userName').value.trim();
      
      if (userName.length < 2) {
        alert('Por favor, ingresa un nombre válido (mínimo 2 caracteres).');
        return;
      }
      
      currentUser = userName;
      await guardarDatos('currentUser', userName);
      
      // Registrar el login
      await registrarCambio('Login', `${userName} ingresó al sistema`);
      
      mostrarContenidoPrincipal();
    });
    
    // Mostrar contenido principal
    async function mostrarContenidoPrincipal() {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('currentUser').textContent = currentUser;
      
      // Inicializar la aplicación
      renderFormDias();
      await renderTabla();
      await renderListaParejas();
      await mostrarAuditoria();
      await cargarNotas();
      await mostrarNotasGuardadas();
    }
    
    // Mostrar pantalla de login
    function mostrarPantallaLogin() {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('userName').focus();
    }
    
    // Cambiar usuario
    async function cambiarUsuario() {
      if (confirm('¿Estás seguro de que quieres cambiar de usuario? Se cerrará la sesión actual.')) {
        await registrarCambio('Logout', `${currentUser} cerró sesión`);
        await eliminarDatos('currentUser');
        currentUser = null;
        document.getElementById('userName').value = '';
        mostrarPantallaLogin();
      }
    }
    
    // === SISTEMA DE AUDITORÍA ===
    
    // Registrar cambios
    async function registrarCambio(accion, descripcion) {
      const auditoria = await cargarAuditoria();
      const cambio = {
        timestamp: new Date().toISOString(),
        usuario: currentUser,
        accion: accion,
        descripcion: descripcion
      };
      
      auditoria.unshift(cambio); // Agregar al principio
      
      // Mantener solo los últimos 50 cambios
      if (auditoria.length > 50) {
        auditoria.splice(50);
      }
      
      await guardarDatos('auditoria', auditoria);
      mostrarAuditoria();
    }
    
    // Cargar auditoría
    async function cargarAuditoria() {
      try {
        return await cargarDatos('auditoria', []);
      } catch {
        return [];
      }
    }
    
    // Mostrar auditoría
    async function mostrarAuditoria() {
      const auditoria = await cargarAuditoria();
      const container = document.getElementById('auditLog');
      
      if (auditoria.length === 0) {
        container.innerHTML = '<p class="small">No hay cambios registrados aún.</p>';
        return;
      }
      
      let html = '';
      auditoria.slice(0, 10).forEach(cambio => { // Mostrar solo los últimos 10
        const fecha = new Date(cambio.timestamp);
        const fechaFormateada = fecha.toLocaleString('es-ES');
        
        html += `<div class="audit-entry">
          <strong>${cambio.accion}:</strong> ${cambio.descripcion}
          <br><span class="audit-timestamp">👤 ${cambio.usuario} - ⏰ ${fechaFormateada}</span>
        </div>`;
      });
      
      if (auditoria.length > 10) {
        html += `<p class="small" style="text-align: center; margin-top: 10px;">
          ... y ${auditoria.length - 10} cambios más antiguos
        </p>`;
      }
      
      container.innerHTML = html;
    }
    
    // Limpiar auditoría con contraseña
    function limpiarAuditoria() {
      const clave = prompt('🔒 Esta acción requiere autorización.\nIngresa la clave de administrador para limpiar el registro:');
      
      if (clave === null) {
        // Usuario canceló
        return;
      }
      
      if (clave !== 'Jessica') {
        alert('❌ Clave incorrecta. Solo el administrador puede limpiar el registro de cambios.');
        registrarCambio('Acceso Denegado', `Intento fallido de limpiar auditoría con clave: "${clave}"`);
        return;
      }
      
      // Clave correcta
      if (confirm('✅ Clave correcta.\n¿Estás seguro de que quieres limpiar el registro de cambios?\n\nEsta acción no se puede deshacer y eliminará todo el historial.')) {
        localStorage.removeItem('auditoria');
        registrarCambio('Sistema', `Registro de auditoría limpiado por administrador`);
        mostrarAuditoria();
        alert('🗑️ Registro de cambios limpiado exitosamente.');
      }
    }

    // === SISTEMA DE NOTAS ===
    
    // Cargar notas al inicializar (solo el textarea)
    async function cargarNotas() {
      const notas = await cargarDatos('notasEditor', '');
      document.getElementById('notasTextarea').value = notas;
    }
    
    // Mostrar notas guardadas
    async function mostrarNotasGuardadas() {
      const notasGuardadas = await cargarDatos('notasGuardadas', '');
      const ultimaModificacion = await cargarDatos('ultimaModificacionNotas');
      const container = document.getElementById('notasGuardadas');
      const timestampElement = document.getElementById('ultimaModificacion');
      
      if (notasGuardadas.trim()) {
        container.innerHTML = notasGuardadas;
        
        if (ultimaModificacion) {
          const fecha = new Date(ultimaModificacion);
          timestampElement.textContent = `Última modificación: ${fecha.toLocaleString('es-ES')}`;
        }
      } else {
        container.innerHTML = '<p class="small" style="color: #666; font-style: italic;">No hay notas guardadas aún.</p>';
        timestampElement.textContent = '';
      }
    }
    
    // Guardar notas
    async function guardarNotas() {
      const notasEditor = document.getElementById('notasTextarea').value;
      
      if (!notasEditor.trim()) {
        alert('⚠️ El editor está vacío. Escribe algo antes de guardar.');
        return;
      }
      
      // Guardar las notas del editor en las notas guardadas
      await guardarDatos('notasGuardadas', notasEditor);
      await guardarDatos('ultimaModificacionNotas', new Date().toISOString());
      
      // Limpiar el editor después de guardar
      document.getElementById('notasTextarea').value = '';
      await eliminarDatos('notasEditor');
      
      // Actualizar la vista
      mostrarNotasGuardadas();
      
      // Registrar la acción
      const preview = notasEditor.length > 50 ? notasEditor.substring(0, 50) + '...' : notasEditor;
      await registrarCambio('Notas Guardadas', `Se guardaron notas: "${preview}"`);
      
      alert('📝 Notas guardadas exitosamente y editor limpiado.');
    }
    
    // Limpiar notas guardadas
    async function limpiarNotasGuardadas() {
      if (confirm('¿Estás seguro de que quieres limpiar las notas guardadas?\n\nEsta acción no se puede deshacer.')) {
        await eliminarDatos('notasGuardadas');
        await eliminarDatos('ultimaModificacionNotas');
        
        // Actualizar la vista
        mostrarNotasGuardadas();
        
        // Registrar la acción
        await registrarCambio('Notas Eliminadas', 'Se eliminaron las notas guardadas');
        
        alert('�️ Notas guardadas eliminadas exitosamente.');
      }
    }
    
    // Limpiar solo el editor de texto
    async function limpiarTextarea() {
      if (confirm('¿Limpiar el contenido del editor?\n\nEsto solo limpiará lo que estás escribiendo, no las notas guardadas.')) {
        document.getElementById('notasTextarea').value = '';
        await eliminarDatos('notasEditor');
        alert('📄 Editor limpiado.');
      }
    }
    
    // Guardar automáticamente el contenido del editor mientras se escribe
    document.addEventListener('DOMContentLoaded', function() {
      const textarea = document.getElementById('notasTextarea');
      if (textarea) {
        textarea.addEventListener('input', async function() {
          await guardarDatos('notasEditor', this.value);
        });
      }

    // Mostrar estadísticas de distribución
    function mostrarEstadisticas(asignaciones, parejas) {
      const conteoTurnos = {};
      const totalTurnos = DIAS.length * TURNOS.length;
      let turnosAsignados = 0;
      
      // Contar turnos por pareja
      parejas.forEach(pareja => {
        const key = pareja.nombre1 + ' & ' + pareja.nombre2;
        conteoTurnos[key] = 0;
      });
      
      // Contar asignaciones
      for (let dia = 0; dia < DIAS.length; dia++) {
        for (let t = 0; t < TURNOS.length; t++) {
          const pareja = asignaciones[dia][t];
          if (pareja) {
            const key = pareja.nombre1 + ' & ' + pareja.nombre2;
            conteoTurnos[key]++;
            turnosAsignados++;
          }
        }
      }
      
      let htmlStats = `<div class="form-section">
        <h3>📊 Estadísticas de distribución</h3>
        <p><strong>Turnos asignados:</strong> ${turnosAsignados} de ${totalTurnos} (${((turnosAsignados/totalTurnos)*100).toFixed(1)}%)</p>
        <table style="margin-top: 10px;">
          <thead>
            <tr><th>Pareja</th><th>Turnos asignados</th><th>Porcentaje</th></tr>
          </thead>
          <tbody>`;
      
      Object.entries(conteoTurnos).forEach(([pareja, turnos]) => {
        const porcentaje = turnosAsignados > 0 ? ((turnos / turnosAsignados) * 100).toFixed(1) : 0;
        htmlStats += `<tr>
          <td>${pareja}</td>
          <td>${turnos}</td>
          <td>${porcentaje}%</td>
        </tr>`;
      });
      
      htmlStats += `</tbody></table></div>`;
      document.getElementById('estadisticasDistribucion').innerHTML = htmlStats;
    }

    // Generar asignaciones automáticas con rotación sistemática
    function generarAsignacionesAutomaticas(parejas) {
      const asignaciones = [];
      
      if (parejas.length === 0) {
        for (let dia = 0; dia < DIAS.length; dia++) {
          asignaciones[dia] = [null, null, null];
        }
        return asignaciones;
      }
      
      // Crear tabla de disponibilidad
      const disponibilidad = [];
      for (let dia = 0; dia < DIAS.length; dia++) {
        disponibilidad[dia] = [];
        for (let t = 0; t < TURNOS.length; t++) {
          disponibilidad[dia][t] = parejas.filter(pareja => 
            pareja.turnosPorDia[dia].includes(TURNOS[t].id)
          );
        }
      }
      
      // Algoritmo de rotación sistemática
      let contadorGlobal = 0;
      const ultimaAsignacion = {}; // Para evitar repeticiones consecutivas
      
      for (let dia = 0; dia < DIAS.length; dia++) {
        asignaciones[dia] = [];
        
        for (let t = 0; t < TURNOS.length; t++) {
          const parejasDisponibles = disponibilidad[dia][t];
          let parejaSeleccionada = null;
          
          if (parejasDisponibles.length === 0) {
            parejaSeleccionada = null;
          } else if (parejasDisponibles.length === 1) {
            parejaSeleccionada = parejasDisponibles[0];
          } else {
            // Buscar pareja que no haya trabajado recientemente
            let mejorPareja = null;
            let mejorPuntuacion = -1;
            
            parejasDisponibles.forEach((pareja, index) => {
              const key = pareja.nombre1 + '&' + pareja.nombre2;
              const ultimoDia = ultimaAsignacion[key] || -10;
              const diasSinTrabajar = (dia * TURNOS.length + t) - ultimoDia;
              
              // Dar preferencia a parejas que han descansado más
              let puntuacion = diasSinTrabajar;
              
              // Si es el primer día o hay empate, usar rotación cíclica
              if (!mejorPareja || puntuacion > mejorPuntuacion) {
                mejorPareja = pareja;
                mejorPuntuacion = puntuacion;
              } else if (puntuacion === mejorPuntuacion) {
                // En caso de empate, usar rotación cíclica
                if ((contadorGlobal + index) % parejasDisponibles.length < (contadorGlobal + parejasDisponibles.indexOf(mejorPareja)) % parejasDisponibles.length) {
                  mejorPareja = pareja;
                }
              }
            });
            
            parejaSeleccionada = mejorPareja;
          }
          
          asignaciones[dia][t] = parejaSeleccionada;
          
          if (parejaSeleccionada) {
            const key = parejaSeleccionada.nombre1 + '&' + parejaSeleccionada.nombre2;
            ultimaAsignacion[key] = dia * TURNOS.length + t;
            contadorGlobal++;
          }
        }
      }
      
      return asignaciones;
    }

    // Función para redistribuir turnos
    function redistribuirTurnos() {
      // Mezclar aleatoriamente las parejas para generar nueva distribución
      const parejas = cargarParejas();
      if (parejas.length < 2) {
        alert('Necesitas al menos 2 parejas registradas para redistribuir.');
        return;
      }
      
      // Crear copia mezclada de las parejas
      const parejasMezcladas = [...parejas];
      for (let i = parejasMezcladas.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [parejasMezcladas[i], parejasMezcladas[j]] = [parejasMezcladas[j], parejasMezcladas[i]];
      }
      
      // Regenerar la tabla con el nuevo orden
      renderTabla();
      
      // Registrar la acción
      registrarCambio('Turnos Redistribuidos', 'Se aplicó redistribución aleatoria de turnos');
      
      alert('¡Turnos redistribuidos exitosamente!');
    }

    // Función para generar patrón organizado consecutivo con 2 turnos
    function generarPatronOrganizado() {
      const parejas = cargarParejas();
      if (parejas.length < 3) {
        alert('Necesitas al menos 3 parejas registradas para este patrón (Billy&Chex, Humber&Casimiro, Josh&Axel).');
        return;

      // Sobrescribir temporalmente la función de asignaciones
      window.generarAsignacionesAutomaticas = function(parejas) {
        const asignaciones = [];
        
        // Obtener las tres parejas para el patrón
        const pareja1 = parejas[0]; // Billy & Chex
        const pareja2 = parejas[1]; // Humber & Casimiro  
        const pareja3 = parejas[2]; // Josh & Axel

          [null, pareja2],        // Viernes: Humber&Casimiro 16-00

            nombre2: "Axel",
            turnosPorDia: [
              ["t1", "t2"], // Jueves: ambos turnos disponibles
              ["t1", "t2"], // Viernes: ambos turnos disponibles
              ["t1", "t2"], // Sábado: ambos turnos disponibles
              ["t1", "t2"], // Domingo: ambos turnos disponibles
              ["t1", "t2"], // Lunes: ambos turnos disponibles
              ["t1", "t2"], // Martes: ambos turnos disponibles
              ["t1", "t2"], // Miércoles: ambos turnos disponibles
              ["t1", "t2"]  // Jueves: ambos turnos disponibles
            ]
          }
        ];
        
        const parejasActuales = await cargarParejas();
        const parejasNuevas = [...parejasActuales, ...parejasEjemplo];
        await guardarParejas(parejasNuevas);
        
        // Registrar la acción
        await registrarCambio('Datos de Ejemplo', 'Se cargaron datos de ejemplo (Billy&Chex, Humber&Casimiro, Josh&Axel)');
        
        await renderListaParejas();
        await renderTabla();
        alert('¡Datos de ejemplo cargados! Billy&Chex, Humber&Casimiro y Josh&Axel están listos para el patrón consecutivo con 2 turnos.');
      }
    }
    
    // Inicialización asíncrona
    async function inicializarPagina() {
      await renderTabla();
      await renderListaParejas();
    }
    
    // Ejecutar inicialización cuando la página esté lista
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', inicializarPagina);
    } else {
      inicializarPagina();
    }

    // Descargar CSV
    async function descargarCSV() {
      const parejas = await cargarParejas();
      let filas = [["Día", "Turno", "Pareja", "Tareas asignadas"]];
      for (let dia = 0; dia < DIAS.length; dia++) {
        for (let t = 0; t < TURNOS.length; t++) {
          let pareja = parejas.find(p => p.turnosPorDia[dia].includes(TURNOS[t].id));
          filas.push([
            DIAS[dia],
            TURNOS[t].hora,
            pareja ? pareja.nombre1 + " & " + pareja.nombre2 : "-",
            pareja ? TAREAS.join(" | ") : "-"
          ]);
        }
      }
      let csv = filas.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
      let blob = new Blob([csv], { type: 'text/csv' });
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "asignaciones_turnos.csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    
    // === FUNCIONES DE DEMOSTRACIÓN ===
    
    // Simular la acción de otro usuario para demostrar sincronización
    async function simularOtroUsuario() {
      if (!isOnlineStorageAvailable) {
        alert('⚠️ Función de simulación requiere conexión activa.\n\nEsta función demuestra cómo se sincronizarían los datos entre múltiples usuarios.');
        return;
      }
      
      const parejas = await cargarDatos('parejas', []);
      const nombresDemo = [
        ['María', 'Carlos'], ['Ana', 'José'], ['Luis', 'Elena'], 
        ['Pedro', 'Carmen'], ['Diego', 'Laura'], ['Andrés', 'Sofia'],
        ['Miguel', 'Paola'], ['Roberto', 'Isabel'], ['Fernando', 'Claudia']
      ];
      
      // Elegir una pareja aleatoria que no exista
      const parejaDemo = nombresDemo.find(([n1, n2]) => 
        !parejas.some(p => p.nombre1 === n1 && p.nombre2 === n2)
      );
      
      if (!parejaDemo) {
        // Si ya existen todas, agregar una auditoría demo
        const auditoria = await cargarDatos('auditoria', []);
        const nuevoRegistro = {
          timestamp: new Date().toISOString(),
          usuario: 'Usuario Remoto',
          accion: 'Consulta',
          descripcion: 'Revisó los turnos asignados desde otro dispositivo'
        };
        
        auditoria.unshift(nuevoRegistro);
        await guardarDatos('auditoria', auditoria);
        mostrarAuditoria();
        
        mostrarNotificacion('👥 Otro usuario consultó los turnos');
        return;
      }
      
      // Crear nueva pareja con turnos aleatorios
      const nuevaPareja = {
        nombre1: parejaDemo[0],
        nombre2: parejaDemo[1],
        turnosPorDia: Array.from({length: 7}, () => [Math.random() > 0.5 ? 1 : 2])
      };
      
      parejas.push(nuevaPareja);
      await guardarDatos('parejas', parejas);
      
      // Registrar en auditoría
      const auditoria = await cargarDatos('auditoria', []);
      auditoria.unshift({
        timestamp: new Date().toISOString(),
        usuario: 'Usuario Remoto',
        accion: 'Pareja Agregada',
        descripcion: `Agregó la pareja "${parejaDemo[0]} & ${parejaDemo[1]}" desde otro dispositivo`
      });
      await guardarDatos('auditoria', auditoria);
      
      // Actualizar interfaz
      renderTabla();
      mostrarAuditoria();
      
      mostrarNotificacion(`👥 Otro usuario agregó: ${parejaDemo[0]} & ${parejaDemo[1]}`);
      
      console.log('🎭 Simulado: Otro usuario agregó una pareja');
    }
