<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firebase Connection</title>
</head>
<body>
    <h1>Prueba de Conexión Firebase</h1>
    <div id="status">Probando conexión...</div>
    <button onclick="testWrite()">Probar Escritura</button>
    <button onclick="testRead()">Probar Lectura</button>
    <div id="data"></div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script>
        let database;
        try {
            firebase.initializeApp({
                databaseURL: "https://oficina-turnos-c4f23-default-rtdb.firebaseio.com/"
            });
            database = firebase.database();
            document.getElementById('status').innerHTML = '✅ Firebase inicializado correctamente';
        } catch (error) {
            document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
        }

        function testWrite() {
            const data = {
                timestamp: Date.now(),
                test: 'Prueba de escritura',
                user: 'TestUser'
            };
            
            database.ref('test-data').set(data)
                .then(() => {
                    document.getElementById('status').innerHTML = '✅ Escritura exitosa';
                })
                .catch((error) => {
                    document.getElementById('status').innerHTML = '❌ Error escribiendo: ' + error.message;
                });
        }

        function testRead() {
            database.ref('test-data').once('value')
                .then((snapshot) => {
                    const data = snapshot.val();
                    document.getElementById('data').innerHTML = '📄 Datos leídos: ' + JSON.stringify(data, null, 2);
                })
                .catch((error) => {
                    document.getElementById('status').innerHTML = '❌ Error leyendo: ' + error.message;
                });
        }
    </script>
</body>
</html>
